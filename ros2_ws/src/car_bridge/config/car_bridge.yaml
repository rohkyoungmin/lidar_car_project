arduino_bridge_node:
  ros__parameters:
    serial_port: "/dev/ttyACM0"
    baudrate: 115200
    max_linear: 0.25
    max_angular: 1.0
    cmd_timeout: 0.5
    dry_run: false

safety_stop_node:
  ros__parameters:
    stop_distance: 0.35
    front_angle_deg: 30.0
    allow_turning_when_blocked: true

scan_summary_node:
  ros__parameters: {}

scan_to_json_node:
  ros__parameters:
    output_path: "/home/roh/lidar_car_project/web_control/static/scan_latest.json"
    max_points: 720
    front_angle_deg: 30.0
    stop_distance: 0.35
